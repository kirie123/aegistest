[project]
name = "aegistest"
version = "0.1.0"
description = "Agent Evaluation & Guarded Inspection System — a zero-dependency testing framework for LLM Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AegisTest Contributors"},
]
keywords = [
    "agent", "llm", "testing", "evaluation", "safety", "regression",
    "e2e", "benchmark", "ai", "automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/your-org/aegistest"
Repository = "https://github.com/your-org/aegistest"
Issues = "https://github.com/your-org/aegistest/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "aegistest",
    "aegistest.core",
    "aegistest.analyzers",
    "aegistest.checkers",
    "aegistest.collectors",
    "aegistest.examples",
    "aegistest.regression",
    "aegistest.reports",
]

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
